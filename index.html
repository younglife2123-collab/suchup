<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개인 수첩</title>
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&display=swap">
<style>
/* Concept: 원고지 (Korean manuscript paper). Pale sage paper, green grid rules, pine-ink accent.
   PC: header + list | lined sheet.  Phone: one view at a time, bottom tabs, floating + button.
   Boldness lives in two places only: the 원고지 logo cells and the big month numeral. */
:root{
  --paper:#eef1ec; --sheet:#fbfcf9; --ink:#1d2621; --muted:#66736b; --rule:#cfdcd2;
  --accent:#2e6a4d; --accent-ink:#ffffff; --accent-soft:#dfeae2;
  --sun:#c4432f; --sat:#3a5fa3; --danger:#b3261e;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Hahmlet","Nanum Myeongjo",serif;
  --line:28px; --hdr:60px; --nav:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121714; --sheet:#1a201c; --ink:#e4ebe6; --muted:#8e9c93; --rule:#2c3a31;
  --accent:#86c4a3; --accent-ink:#0f1a14; --accent-soft:#213128; --sun:#ef8471; --sat:#8fb0ea; --danger:#f08a80; color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 원고지 logo */
.brand{display:flex;gap:0;border:1.5px solid var(--accent);border-radius:2px}
.brand span{width:30px;height:30px;display:grid;place-items:center;font:700 17px/1 var(--serif);color:var(--accent)}
.brand span+span{border-left:1.5px solid var(--accent)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--paper);padding-top:env(safe-area-inset-top,0px)}
.bar{height:var(--hdr);display:flex;align-items:center;gap:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:15px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--accent-soft)}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status[data-kind="err"]{color:var(--danger);white-space:normal}
.status[data-kind="warn"]{color:var(--sun)}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn:disabled{opacity:.4}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--accent-soft)}
.btn.danger{color:var(--danger);border-color:transparent;background:none}
.btn.danger[data-armed]{background:var(--danger);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}

/* login */
.login{min-height:calc(100dvh - var(--hdr));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.login .brand span{width:64px;height:64px;font-size:34px}
.login .brand{border-width:2px}.login .brand span+span{border-left-width:2px}
.login p{margin:0;color:var(--muted);max-width:28em;text-wrap:balance}

/* notes */
.notes{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px))}
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.list-head{display:flex;gap:8px;align-items:center;padding:14px 16px 10px max(16px,env(safe-area-inset-left,0px))}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:0 10px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:17px;height:17px}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none;color:var(--ink)}
.items{flex:1;overflow-y:auto;padding:0 8px 16px max(8px,env(safe-area-inset-left,0px))}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:10px;border-bottom:1px solid transparent}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--sheet);box-shadow:0 0 0 1px var(--rule)}
.item b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);padding:20px 12px;font-size:14px;text-wrap:balance}

.editor{display:flex;flex-direction:column;min-height:0;min-width:0;padding:14px max(24px,env(safe-area-inset-right,0px)) 24px 24px}
.ed-head{display:flex;gap:6px;align-items:center;min-height:38px;margin-bottom:10px}
.ed-head .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ed-head .meta[data-dirty]{color:var(--sun)}
.back{display:none}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:28px 40px 0;max-width:820px;width:100%;margin:0 auto}
.sheet input{border:0;background:none;outline:none;font:700 24px/1.35 var(--sans);letter-spacing:-.02em;padding:0 0 14px;width:100%}
.sheet input::placeholder,.sheet textarea::placeholder{color:var(--muted);opacity:.7}
.sheet textarea{flex:1;min-height:0;width:100%;border:0;outline:none;resize:none;font-size:16px;line-height:var(--line);padding:0 0 var(--line);
  background-color:transparent;background-image:linear-gradient(to bottom,transparent calc(var(--line) - 1px),var(--rule) calc(var(--line) - 1px));
  background-size:100% var(--line);background-attachment:local;border-top:1px solid var(--rule)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding:20px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));max-width:1280px;margin:0 auto}
.cal-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.month{display:flex;align-items:baseline;gap:6px;margin:0;font-weight:400}
.month b{font:700 64px/0.9 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.month span{font:700 22px/1 var(--serif)}
.month small{font-size:14px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid var(--accent);border-left:1px solid var(--rule)}
.dow{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 8px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.dow.sun,.day.sun .num{color:var(--sun)}
.dow.sat,.day.sat .num{color:var(--sat)}
.day{background:none;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:104px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;border-radius:0}
.day.blank{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px);opacity:.35}
.day:not(.blank):hover{background:var(--accent-soft)}
.day[aria-pressed="true"]{background:var(--accent-soft)}
.num{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;margin:-3px 0 0 -3px;border-radius:50%}
.day.today .num{background:var(--accent);color:var(--accent-ink)}
.chip{font-size:12px;line-height:1.4;padding-left:6px;border-left:2px solid var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.more{font-size:12px;color:var(--muted);padding-left:8px}
.dots{display:none}

.agenda{align-self:start;position:sticky;top:calc(var(--hdr) + 20px);display:flex;flex-direction:column;gap:12px}
.agenda h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.agenda h2 small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.evs{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.ev time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.ev span{overflow-wrap:anywhere}
.add{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px}
.add input{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
.add input:focus{outline:none;border-color:var(--accent)}
.add .btn{grid-column:1/-1;justify-content:center}

/* phone */
.bottom,.fab{display:none}
@media (max-width:760px){
  .bar{gap:12px}
  .bar .tabs{display:none}
  .notes{grid-template-columns:1fr;height:calc(100dvh - var(--hdr) - var(--nav) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .list{border-right:0}
  body.editing .list{display:none}
  body:not(.editing) .editor{display:none}
  .editor{padding:8px 0 0}
  .ed-head{padding:0 12px}
  .back{display:inline-flex}
  .sheet{border-left:0;border-right:0;border-radius:0;padding:20px max(20px,env(safe-area-inset-left,0px)) 0}
  .sheet input{font-size:21px}
  .cal{grid-template-columns:1fr;gap:20px;padding:16px max(12px,env(safe-area-inset-left,0px)) calc(var(--nav) + 24px)}
  .month b{font-size:52px}
  .day{min-height:56px;align-items:center;padding:6px 2px}
  .num{margin:0}
  .chip,.more{display:none}
  .dots{display:flex;gap:3px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .agenda{position:static}
  .bottom{display:flex;position:fixed;inset:auto 0 0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .bottom button{flex:1;height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600}
  .bottom button[aria-selected="true"]{color:var(--accent)}
  .bottom svg{width:22px;height:22px}
  body.editing .bottom{display:none}
  body.editing .notes{height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .fab{display:grid;place-items:center;position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -6px var(--accent)}
  .fab svg{width:26px;height:26px;stroke-width:2.2}
  body.editing .fab,body.on-cal .fab,body.logged-out .fab{display:none}
  .new-desktop{display:none}
}
body.logged-out .bottom{display:none}
@media (prefers-reduced-motion:reduce){.icon-btn.spin svg{animation:none}}
</style>
</head>
<body class="logged-out">
<header><div class="bar">
  <div class="brand" aria-label="수첩"><span>수</span><span>첩</span></div>
  <div class="tabs" role="tablist" id="tabs" hidden>
    <button data-tab="notes" role="tab" aria-selected="true">노트</button>
    <button data-tab="calendar" role="tab" aria-selected="false">캘린더</button>
  </div>
  <span class="spacer"></span>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="icon-btn" id="refresh" hidden aria-label="새로고침" title="새로고침">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
  </button>
</div></header>

<main>
  <section id="view-login" class="login">
    <div class="brand"><span>수</span><span>첩</span></div>
    <p>노트와 일정을 구글 드라이브의 ‘메모·캘린더’ 폴더에 저장해요. PC와 휴대폰에서 같은 내용을 볼 수 있어요.</p>
    <button class="btn primary" id="login" disabled>구글 계정으로 로그인</button>
  </section>

  <section id="view-notes" class="notes" hidden>
    <div class="list">
      <div class="list-head">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="제목으로 찾기" aria-label="노트 제목으로 찾기">
        </label>
        <button class="btn primary new-desktop" id="new" title="새 노트 (Ctrl+N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 노트
        </button>
      </div>
      <div class="items" id="items"><div class="empty">노트를 불러오는 중이에요.</div></div>
    </div>
    <div class="editor">
      <div class="ed-head">
        <button class="btn ghost back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>목록</button>
        <span class="meta" id="meta"></span>
        <span class="spacer"></span>
        <button class="btn danger" id="del" hidden>삭제</button>
        <button class="btn primary" id="save" hidden disabled>저장</button>
      </div>
      <div class="placeholder" id="ph">왼쪽에서 노트를 고르거나 새 노트를 만드세요.</div>
      <div class="sheet" id="sheet" hidden>
        <input id="title" placeholder="제목" aria-label="제목" maxlength="80" autocomplete="off">
        <textarea id="body" placeholder="내용을 적어 보세요" aria-label="내용"></textarea>
      </div>
    </div>
  </section>

  <section id="view-cal" class="cal" hidden>
    <div>
      <div class="cal-head">
        <h1 class="month" id="month"></h1>
        <span class="spacer"></span>
        <button class="icon-btn" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="btn ghost" id="today">오늘</button>
        <button class="icon-btn" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="agenda">
      <h2 id="sel-title"></h2>
      <div class="evs" id="sel-list"></div>
      <form class="add" id="add">
        <input id="ev-time" type="time" aria-label="시간 (비우면 하루 종일)">
        <input id="ev-text" type="text" placeholder="일정 내용" aria-label="일정 내용" required maxlength="120" autocomplete="off">
        <button class="btn primary" type="submit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>일정 추가</button>
      </form>
    </aside>
  </section>
</main>

<button class="fab" id="fab" aria-label="새 노트"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottom" role="tablist">
  <button data-tab="notes" role="tab" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6"/></svg>노트</button>
  <button data-tab="calendar" role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</button>
</nav>

<script>
const CLIENT_ID = '181885535718-83f9d0mapdplnlekmvhteahs24g24c47.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive';
const ROOT_NAME = '메모·캘린더'; // 프로세스/개인/메모·캘린더
const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const clean = s => s.replace(/[\\/:*?"<>|\n\r\t]/g, ' ').replace(/\s+/g, ' ').trim();
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
  for (const c of kids) if (c != null) e.append(c);
  return e;
}
function status(msg, kind = '') { const s = $('#status'); s.textContent = msg; s.dataset.kind = kind; }

/* ---------- auth ---------- */
let token = null, tokenClient = null, NOTES = null, CAL = null;
function loadToken() { try { const t = JSON.parse(localStorage.getItem('tok')); if (t && t.exp > Date.now() + 60000) return t.v; } catch {} return null; }
function saveToken(v, sec) { try { localStorage.setItem('tok', JSON.stringify({ v, exp: Date.now() + sec * 1000 })); } catch {} }
function dropToken() { token = null; try { localStorage.removeItem('tok'); } catch {} }
class AuthError extends Error {}

function needLogin(msg) {
  dropToken();
  document.body.classList.add('logged-out');
  $('#view-login').hidden = false; $('#tabs').hidden = true; $('#refresh').hidden = true;
  $('#view-notes').hidden = true; $('#view-cal').hidden = true;
  status(msg || '', msg ? 'warn' : '');
}
function showApp() {
  document.body.classList.remove('logged-out');
  $('#view-login').hidden = true; $('#tabs').hidden = false; $('#refresh').hidden = false;
  showTab(location.hash.slice(1));
}
window.gisReady = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: resp => {
      if (resp.error) { status('로그인하지 못했어요: ' + resp.error, 'err'); return; }
      token = resp.access_token; saveToken(token, Number(resp.expires_in) || 3600);
      showApp(); syncAll();
    },
  });
  $('#login').disabled = false;
};
$('#login').onclick = () => tokenClient && tokenClient.requestAccessToken();

/* ---------- drive ---------- */
async function api(url, opts = {}) {
  if (!token) throw new AuthError();
  let r;
  try { r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } }); }
  catch { throw new Error('인터넷에 연결되지 않았어요.'); }
  if (r.status === 401) throw new AuthError();
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`드라이브 오류 ${r.status}: ${t.slice(0, 160)}`); }
  return r;
}
const enc = encodeURIComponent;
const qstr = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function list(query, order = '') {
  const out = []; let pt = '';
  do {
    const r = await api(`${API}/files?q=${enc(query)}&fields=${enc('files(id,name,modifiedTime),nextPageToken')}&pageSize=1000${order ? '&orderBy=' + enc(order) : ''}${pt ? '&pageToken=' + enc(pt) : ''}`);
    const j = await r.json(); out.push(...(j.files || [])); pt = j.nextPageToken || '';
  } while (pt);
  return out;
}
async function folder(name, parent) {
  const f = (await list(`name = '${qstr(name)}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false` + (parent ? ` and '${parent}' in parents` : '')))[0];
  if (f) return f.id;
  if (!parent) throw new Error(`드라이브에서 ‘${name}’ 폴더를 찾지 못했어요.`);
  const r = await api(`${API}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parent] }) });
  return (await r.json()).id;
}
async function upload(method, id, meta, text) {
  const b = 'suchup' + Math.random().toString(36).slice(2) + Date.now();
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;
  const r = await api(`${UP}/files${id ? '/' + id : ''}?uploadType=multipart&fields=id,name,modifiedTime`, { method, headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body });
  return r.json();
}
const createFile = (parent, name, text) => upload('POST', null, { name, parents: [parent], mimeType: 'text/markdown' }, text);
const updateFile = (id, name, text) => upload('PATCH', id, { name }, text);
const trash = id => api(`${API}/files/${id}?fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: '{"trashed":true}' });
const readText = async id => (await api(`${API}/files/${id}?alt=media`)).text();
const fail = e => e instanceof AuthError ? needLogin('로그인 시간이 지났어요. 다시 로그인해 주세요.') : status(e.message, 'err');

// two-step delete: first tap arms, second tap deletes
function armDelete(btn, label, run) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; run(); return; }
  btn.dataset.armed = '1'; btn.textContent = '한 번 더 누르면 삭제';
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; } }, 4000);
}

/* ---------- notes ---------- */
// file format: "# 제목\n\n본문" ; file name: "제목.md"
let notes = [], cur = null, saving = false; // cur: {id|null, t, b}
const tEl = $('#title'), bEl = $('#body');
const noteName = t => t.replace(/\.md$/i, '');
const dirty = () => !!cur && (tEl.value !== cur.t || bEl.value !== cur.b);
function splitNote(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const i = lines.findIndex(l => l.trim());
  if (i < 0) return { t: '', b: '' };
  return { t: lines[i].replace(/^#+\s*/, '').trim(), b: lines.slice(i + 1).join('\n').replace(/^\n+/, '') };
}
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (ymd(d) === ymd(now)) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (ymd(d) === ymd(y)) return '어제';
  return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
const longWhen = iso => { const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일 ${pad(d.getHours())}:${pad(d.getMinutes())}에 저장됨`; };

function renderNotes() {
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#items'); box.replaceChildren();
  const shown = notes.filter(n => !q || n.name.toLowerCase().includes(q));
  if (!shown.length) box.append(el('div', { class: 'empty' }, notes.length ? '찾는 제목의 노트가 없어요.' : '아직 노트가 없어요. 새 노트로 첫 장을 채워 보세요.'));
  for (const n of shown) {
    const b = el('button', { class: 'item', 'aria-current': String(!!cur && cur.id === n.id) }, el('b', {}, noteName(n.name)), el('time', {}, when(n.modifiedTime)));
    b.onclick = () => openNote(n.id);
    box.append(b);
  }
}
function renderEditor() {
  const on = !!cur;
  $('#sheet').hidden = !on; $('#ph').hidden = on;
  $('#del').hidden = !on; $('#save').hidden = !on;
  $('#save').disabled = !dirty() || saving;
  const n = on && cur.id && notes.find(x => x.id === cur.id);
  const m = $('#meta');
  m.textContent = !on ? '' : saving ? '저장하는 중' : dirty() ? '저장 안 됨' : n ? longWhen(n.modifiedTime) : '새 노트';
  m.toggleAttribute('data-dirty', on && dirty() && !saving);
}
async function loadNotes() {
  notes = (await list(`'${NOTES}' in parents and trashed = false`, 'modifiedTime desc')).filter(f => /\.md$/i.test(f.name));
  renderNotes(); renderEditor();
}
async function openNote(id) {
  if (dirty()) await saveNote();
  if (dirty()) return;
  status('노트를 여는 중');
  try {
    const { t, b } = splitNote(await readText(id));
    cur = { id, t, b }; tEl.value = t; bEl.value = b; bEl.scrollTop = 0;
    document.body.classList.add('editing');
    renderNotes(); renderEditor(); status('');
  } catch (e) { fail(e); }
}
async function newNote() {
  if (dirty()) await saveNote();
  if (dirty()) return;
  cur = { id: null, t: '', b: '' }; tEl.value = ''; bEl.value = '';
  document.body.classList.add('editing');
  renderNotes(); renderEditor(); tEl.focus();
}
async function saveNote() {
  if (!dirty() || saving) return;
  if (!tEl.value.trim() && !bEl.value.trim()) { status('빈 노트는 저장하지 않아요.', 'warn'); return; }
  const title = clean(tEl.value).slice(0, 80) || clean(bEl.value.split('\n').find(l => l.trim()) || '').slice(0, 40) || '제목 없음';
  tEl.value = title;
  const body = bEl.value;
  saving = true; renderEditor();
  try {
    const text = `# ${title}\n\n${body}`;
    const f = cur.id ? await updateFile(cur.id, title + '.md', text) : await createFile(NOTES, title + '.md', text);
    cur.id = f.id; cur.t = title; cur.b = body;
    notes = [f, ...notes.filter(n => n.id !== f.id)];
    status('');
  } catch (e) { fail(e); }
  saving = false; renderNotes(); renderEditor();
}
async function deleteNote() {
  if (!cur) return;
  if (cur.id) {
    try { await trash(cur.id); } catch (e) { fail(e); return; }
    notes = notes.filter(n => n.id !== cur.id);
  }
  cur = null; tEl.value = ''; bEl.value = ''; document.body.classList.remove('editing');
  renderNotes(); renderEditor(); status('드라이브 휴지통으로 옮겼어요.');
}
tEl.addEventListener('input', renderEditor);
bEl.addEventListener('input', renderEditor);
tEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); bEl.focus(); } });
$('#q').addEventListener('input', renderNotes);
$('#new').onclick = newNote;
$('#fab').onclick = newNote;
$('#save').onclick = saveNote;
$('#del').onclick = e => armDelete(e.currentTarget, '삭제', deleteNote);
$('#back').onclick = async () => { if (dirty()) await saveNote(); if (!dirty()) { document.body.classList.remove('editing'); } };
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === 's') { e.preventDefault(); saveNote(); }
});

/* ---------- calendar ---------- */
// one file per event: "YYYY-MM-DD[ HH:MM] 내용.md"
let events = [], calLoaded = false;
const view = new Date(); view.setDate(1);
let sel = ymd(new Date());
const parseEv = f => { const m = /^(\d{4}-\d{2}-\d{2})(?: (\d{2}:\d{2}))? (.+?)(?:\.md)?$/.exec(f.name); return m && { id: f.id, date: m[1], time: m[2] || '', text: m[3] }; };
const byTime = (a, b) => a.time.localeCompare(b.time) || a.text.localeCompare(b.text);

function renderCal() {
  const y = view.getFullYear(), m = view.getMonth();
  $('#month').replaceChildren(el('b', {}, String(m + 1)), el('span', {}, '월'), el('small', {}, String(y)));
  const g = $('#grid'); g.replaceChildren();
  DOW.forEach((d, i) => g.append(el('div', { class: 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') }, d)));
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = ymd(new Date());
  const cells = Math.ceil((first + days) / 7) * 7;
  for (let i = 0; i < cells; i++) {
    const n = i - first + 1;
    if (n < 1 || n > days) { g.append(el('div', { class: 'day blank' })); continue; }
    const date = `${y}-${pad(m + 1)}-${pad(n)}`, wd = i % 7;
    const evs = events.filter(e => e.date === date).sort(byTime);
    const b = el('button', { class: 'day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (date === today ? ' today' : ''), 'aria-pressed': String(date === sel), 'aria-label': `${m + 1}월 ${n}일, 일정 ${evs.length}개` },
      el('span', { class: 'num' }, String(n)));
    evs.slice(0, 3).forEach(e => b.append(el('span', { class: 'chip' }, e.time ? el('i', {}, e.time) : null, e.text)));
    if (evs.length > 3) b.append(el('span', { class: 'more' }, `외 ${evs.length - 3}개`));
    if (evs.length) { const d = el('span', { class: 'dots' }); evs.slice(0, 3).forEach(() => d.append(el('i'))); b.append(d); }
    b.onclick = () => { sel = date; renderCal(); };
    g.append(b);
  }
  const [sy, sm, sd] = sel.split('-').map(Number);
  $('#sel-title').replaceChildren(`${sm}월 ${sd}일`, el('small', {}, `${DOW[new Date(sy, sm - 1, sd).getDay()]}요일`));
  const box = $('#sel-list'); box.replaceChildren();
  const evs = events.filter(e => e.date === sel).sort(byTime);
  if (!evs.length) box.append(el('div', { class: 'empty', style: 'padding:14px 0' }, calLoaded ? '이 날은 비어 있어요. 아래에서 일정을 추가하세요.' : '일정을 불러오는 중이에요.'));
  for (const e of evs) {
    const del = el('button', { class: 'btn danger' }, '삭제');
    del.onclick = () => armDelete(del, '삭제', () => deleteEvent(e));
    box.append(el('div', { class: 'ev' }, el('time', {}, e.time || '종일'), el('span', {}, e.text), del));
  }
}
async function loadCal() {
  events = (await list(`'${CAL}' in parents and trashed = false`)).map(parseEv).filter(Boolean);
  calLoaded = true; renderCal();
}
$('#add').addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = clean($('#ev-text').value).slice(0, 120), time = $('#ev-time').value;
  if (!text) return;
  status('일정을 추가하는 중');
  try {
    const f = await createFile(CAL, `${sel}${time ? ' ' + time : ''} ${text}.md`, text);
    events.push({ id: f.id, date: sel, time, text });
    $('#ev-text').value = ''; $('#ev-time').value = '';
    renderCal(); status('');
  } catch (e) { fail(e); }
});
async function deleteEvent(e) {
  try { await trash(e.id); events = events.filter(x => x.id !== e.id); renderCal(); status('드라이브 휴지통으로 옮겼어요.'); }
  catch (err) { fail(err); }
}
$('#prev').onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); };
$('#next').onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); };
$('#today').onclick = () => { const t = new Date(); view.setFullYear(t.getFullYear(), t.getMonth(), 1); sel = ymd(t); renderCal(); };

/* ---------- tabs, sync, boot ---------- */
function showTab(name) {
  if (!token) return;
  const cal = name === 'calendar';
  $('#view-cal').hidden = !cal; $('#view-notes').hidden = cal;
  document.body.classList.toggle('on-cal', cal);
  $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', String((b.dataset.tab === 'calendar') === cal)));
}
$$('[data-tab]').forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

let syncing = false;
async function syncAll() {
  if (!token || syncing) return;
  if (dirty()) await saveNote();
  syncing = true; $('#refresh').disabled = true; $('#refresh').classList.add('spin'); status('');
  try {
    if (!NOTES) { const root = await folder(ROOT_NAME); NOTES = await folder('노트', root); CAL = await folder('캘린더', root); }
    await loadNotes(); await loadCal();
  } catch (e) { fail(e); }
  syncing = false; $('#refresh').disabled = false; $('#refresh').classList.remove('spin');
}
$('#refresh').onclick = syncAll;
// pick up changes made on the other device when the app comes back to the front
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !dirty()) syncAll(); });

renderCal(); renderEditor();
token = loadToken();
if (token) { showApp(); syncAll(); } else needLogin();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
