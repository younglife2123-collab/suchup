<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개인 수첩</title>
<meta name="theme-color" content="#2d5a86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with two tabs; notes = list | editor (stacks on phone); calendar = Sunday-first month grid + day agenda */
:root{
  --paper:#f2f4f6; --sheet:#ffffff; --ink:#1c2631; --muted:#5b6979; --line:#d8dfe6;
  --accent:#2d5a86; --accent-soft:#e2ebf4; --sun:#c0412c; --sat:#2d5a86; --danger:#b3261e; --ok:#2e7d4f;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#11161c; --sheet:#19212a; --ink:#e3e9ef; --muted:#93a1b0; --line:#2a3440;
  --accent:#88b3dd; --accent-soft:#1e3246; --sun:#ef8270; --sat:#88b3dd; --danger:#f2877d; --ok:#7cc79a; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
h1{font:700 22px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--sheet)}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted);min-width:0}
.status[data-kind="err"]{color:var(--danger)}
.status[data-kind="warn"]{color:var(--sun)}
.status[data-kind="ok"]{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:500}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

main{padding-block:16px 32px}
.login{max-width:420px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login h2{font:700 26px/1.3 var(--display);margin:0}
.login p{margin:0;color:var(--muted)}

/* notes */
.notes{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.list-head{display:flex;gap:8px;align-items:center}
.list-head input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:16px 12px;font-size:14px}
.editor{display:flex;flex-direction:column;gap:8px;min-width:0}
.ed-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-head .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
textarea#ed{width:100%;min-height:62vh;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:16px;line-height:1.7}
.back{display:none}
@media (max-width:760px){
  .notes{grid-template-columns:1fr}
  body.editing .list{display:none}
  body:not(.editing) .editor{display:none}
  .back{display:inline-block}
}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font:700 20px/1.2 var(--display);margin:0 6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--sheet);text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:6px 0}
.dow.sun,.day.sun .num{color:var(--sun)}
.dow.sat,.day.sat .num{color:var(--sat)}
.day{background:var(--sheet);border:0;min-height:92px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.blank{background:var(--paper);cursor:default}
.day:not(.blank):hover{background:var(--accent-soft)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.day.today .num{background:var(--accent);color:var(--sheet);border-radius:999px;padding:0 7px;align-self:flex-start}
.chip{font-size:12px;line-height:1.35;background:var(--accent-soft);border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11.5px;color:var(--muted)}
.dots{display:none}
@media (max-width:560px){
  .day{min-height:54px;align-items:center}
  .chip,.more{display:none}
  .dots{display:flex;gap:3px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .day.today .num{align-self:center}
}
.agenda{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.agenda h3{margin:0;font:700 17px/1.3 var(--display)}
.ev{display:flex;align-items:center;gap:10px;padding-block:6px;border-bottom:1px solid var(--line)}
.ev:last-of-type{border-bottom:0}
.ev time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:44px;flex:none}
.ev span{flex:1;min-width:0;overflow-wrap:anywhere}
form.add{display:flex;gap:8px;flex-wrap:wrap}
form.add input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px}
form.add input[type="text"]{flex:1;min-width:160px}
@media (prefers-reduced-motion:no-preference){.item,.day,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <h1>개인 수첩</h1>
  <div class="tabs" role="tablist" id="tabs" hidden>
    <button id="tab-notes" role="tab" aria-selected="true">노트</button>
    <button id="tab-cal" role="tab" aria-selected="false">캘린더</button>
  </div>
  <span class="spacer"></span>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="btn" id="refresh" hidden>새로고침</button>
</div></header>

<main class="wrap">
  <section id="view-login" class="login">
    <h2>구글 드라이브에 로그인</h2>
    <p>노트와 일정은 드라이브의 ‘메모·캘린더’ 폴더에 저장돼요.</p>
    <button class="btn primary" id="login" disabled>구글 계정으로 로그인</button>
  </section>

  <section id="view-notes" class="notes" hidden>
    <div class="list">
      <div class="list-head">
        <input id="q" type="search" placeholder="노트 제목 검색" aria-label="노트 제목 검색">
        <button class="btn primary" id="new">새 노트</button>
      </div>
      <div class="items" id="items"><div class="empty">노트를 불러오는 중…</div></div>
    </div>
    <div class="editor">
      <div class="ed-head">
        <button class="btn back" id="back">← 목록</button>
        <span class="meta" id="meta">노트를 고르거나 새로 만드세요.</span>
        <span class="spacer"></span>
        <button class="btn danger" id="del" disabled>삭제</button>
        <button class="btn primary" id="save" disabled>저장</button>
      </div>
      <textarea id="ed" placeholder="첫 줄이 노트 제목이 돼요." disabled aria-label="노트 내용"></textarea>
    </div>
  </section>

  <section id="view-cal" hidden>
    <div class="cal-head">
      <button class="btn" id="prev" aria-label="이전 달">‹</button>
      <h2 id="month"></h2>
      <button class="btn" id="next" aria-label="다음 달">›</button>
      <button class="btn" id="today">오늘</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="agenda">
      <h3 id="sel-title"></h3>
      <div id="sel-list"></div>
      <form class="add" id="add">
        <input id="ev-time" type="time" aria-label="시간 (비우면 종일)">
        <input id="ev-text" type="text" placeholder="일정 추가" aria-label="일정 내용" required maxlength="120">
        <button class="btn primary" type="submit">추가</button>
      </form>
    </div>
  </section>
</main>

<script>
const CLIENT_ID = '181885535718-83f9d0mapdplnlekmvhteahs24g24c47.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive';
const ROOT_NAME = '메모·캘린더'; // 프로세스/개인/메모·캘린더
const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const clean = s => s.replace(/[\\/:*?"<>|\n\r\t]/g, ' ').replace(/\s+/g, ' ').trim();
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
  for (const c of kids) if (c != null) e.append(c);
  return e;
}
function status(msg, kind = '') { const s = $('#status'); s.textContent = msg; s.dataset.kind = kind; }

/* ---------- auth ---------- */
let token = null, tokenClient = null, NOTES = null, CAL = null;
function loadToken() { try { const t = JSON.parse(localStorage.getItem('tok')); if (t && t.exp > Date.now() + 60000) return t.v; } catch {} return null; }
function saveToken(v, sec) { try { localStorage.setItem('tok', JSON.stringify({ v, exp: Date.now() + sec * 1000 })); } catch {} }
function dropToken() { token = null; try { localStorage.removeItem('tok'); } catch {} }
class AuthError extends Error {}

function needLogin(msg) {
  dropToken();
  $('#view-login').hidden = false; $('#tabs').hidden = true; $('#refresh').hidden = true;
  $('#view-notes').hidden = true; $('#view-cal').hidden = true;
  status(msg || '', msg ? 'warn' : '');
}
function showApp() {
  $('#view-login').hidden = true; $('#tabs').hidden = false; $('#refresh').hidden = false;
  showTab(location.hash.slice(1));
}
window.gisReady = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: resp => {
      if (resp.error) { status('로그인하지 못했어요: ' + resp.error, 'err'); return; }
      token = resp.access_token; saveToken(token, Number(resp.expires_in) || 3600);
      showApp(); syncAll();
    },
  });
  $('#login').disabled = false;
};
$('#login').onclick = () => tokenClient && tokenClient.requestAccessToken();

/* ---------- drive ---------- */
async function api(url, opts = {}) {
  if (!token) throw new AuthError();
  let r;
  try { r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } }); }
  catch { throw new Error('인터넷에 연결되지 않았어요.'); }
  if (r.status === 401) throw new AuthError();
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`드라이브 오류 ${r.status}: ${t.slice(0, 160)}`); }
  return r;
}
const enc = encodeURIComponent;
const qstr = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function list(query, order = '') {
  const out = []; let pt = '';
  do {
    const r = await api(`${API}/files?q=${enc(query)}&fields=${enc('files(id,name,modifiedTime),nextPageToken')}&pageSize=1000${order ? '&orderBy=' + enc(order) : ''}${pt ? '&pageToken=' + enc(pt) : ''}`);
    const j = await r.json(); out.push(...(j.files || [])); pt = j.nextPageToken || '';
  } while (pt);
  return out;
}
async function folder(name, parent) {
  const f = (await list(`name = '${qstr(name)}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false` + (parent ? ` and '${parent}' in parents` : '')))[0];
  if (f) return f.id;
  if (!parent) throw new Error(`드라이브에서 ‘${name}’ 폴더를 찾지 못했어요.`);
  const r = await api(`${API}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parent] }) });
  return (await r.json()).id;
}
async function upload(method, id, meta, text) {
  const b = 'suchup' + Math.random().toString(36).slice(2) + Date.now();
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;
  const r = await api(`${UP}/files${id ? '/' + id : ''}?uploadType=multipart&fields=id,name,modifiedTime`, { method, headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body });
  return r.json();
}
const createFile = (parent, name, text) => upload('POST', null, { name, parents: [parent], mimeType: 'text/markdown' }, text);
const updateFile = (id, name, text) => upload('PATCH', id, { name }, text);
const trash = id => api(`${API}/files/${id}?fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: '{"trashed":true}' });
const readText = async id => (await api(`${API}/files/${id}?alt=media`)).text();
const fail = e => e instanceof AuthError ? needLogin('로그인이 만료됐어요. 다시 로그인해 주세요.') : status(e.message, 'err');

// two-step delete button
function armDelete(btn, label, run) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; run(); return; }
  btn.dataset.armed = '1'; btn.textContent = '한 번 더 누르면 삭제';
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = label; } }, 4000);
}

/* ---------- notes ---------- */
let notes = [], cur = null, saving = false; // cur: {id|null, saved}
const ed = $('#ed');
const noteName = t => t.replace(/\.md$/i, '');
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const titleOf = text => clean((text.split('\n').find(l => l.trim()) || '').replace(/^#+\s*/, '')).slice(0, 80) || '제목 없음';
const dirty = () => !!cur && ed.value !== cur.saved;

function renderNotes() {
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#items'); box.replaceChildren();
  const shown = notes.filter(n => !q || n.name.toLowerCase().includes(q));
  if (!shown.length) box.append(el('div', { class: 'empty' }, notes.length ? '검색 결과가 없어요.' : '아직 노트가 없어요. ‘새 노트’로 첫 노트를 만드세요.'));
  for (const n of shown) {
    const b = el('button', { class: 'item', 'aria-current': String(!!cur && cur.id === n.id) }, el('b', {}, noteName(n.name)), el('small', {}, fmt(n.modifiedTime)));
    b.onclick = () => openNote(n.id);
    box.append(b);
  }
}
function renderEditor() {
  const on = !!cur;
  ed.disabled = !on; $('#del').disabled = !on;
  $('#save').disabled = !dirty() || saving;
  const n = on && cur.id && notes.find(x => x.id === cur.id);
  $('#meta').textContent = !on ? '노트를 고르거나 새로 만드세요.' : dirty() ? '저장 안 됨' : n ? `${fmt(n.modifiedTime)} 저장됨` : '새 노트';
}
async function loadNotes() {
  notes = (await list(`'${NOTES}' in parents and trashed = false`, 'modifiedTime desc')).filter(f => /\.md$/i.test(f.name));
  renderNotes(); renderEditor();
}
async function openNote(id) {
  if (dirty()) await saveNote();
  if (dirty()) return;
  status('노트를 여는 중…');
  try {
    const text = await readText(id);
    cur = { id, saved: text }; ed.value = text;
    document.body.classList.add('editing');
    renderNotes(); renderEditor(); status('');
  } catch (e) { fail(e); }
}
async function newNote() {
  if (dirty()) await saveNote();
  if (dirty()) return;
  cur = { id: null, saved: '' }; ed.value = '';
  document.body.classList.add('editing');
  renderNotes(); renderEditor(); ed.focus();
}
async function saveNote() {
  if (!dirty() || saving) return;
  const text = ed.value;
  if (!text.trim()) { status('빈 노트는 저장하지 않아요.', 'warn'); return; }
  saving = true; renderEditor(); status('저장 중…');
  const name = titleOf(text) + '.md';
  try {
    const f = cur.id ? await updateFile(cur.id, name, text) : await createFile(NOTES, name, text);
    cur.id = f.id; cur.saved = text;
    notes = [f, ...notes.filter(n => n.id !== f.id)];
    status('저장됨', 'ok');
  } catch (e) { fail(e); }
  saving = false; renderNotes(); renderEditor();
}
async function deleteNote() {
  if (!cur) return;
  if (cur.id) {
    status('삭제 중…');
    try { await trash(cur.id); } catch (e) { fail(e); return; }
    notes = notes.filter(n => n.id !== cur.id);
  }
  cur = null; ed.value = ''; document.body.classList.remove('editing');
  renderNotes(); renderEditor(); status('드라이브 휴지통으로 옮겼어요.', 'ok');
}
ed.addEventListener('input', renderEditor);
$('#q').addEventListener('input', renderNotes);
$('#new').onclick = newNote;
$('#save').onclick = saveNote;
$('#del').onclick = e => armDelete(e.currentTarget, '삭제', deleteNote);
$('#back').onclick = async () => { if (dirty()) await saveNote(); if (!dirty()) document.body.classList.remove('editing'); };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); } });

/* ---------- calendar ---------- */
// one file per event: "YYYY-MM-DD[ HH:MM] 내용.md"
let events = [], calLoaded = false;
const view = new Date(); view.setDate(1);
let sel = ymd(new Date());
const parseEv = f => { const m = /^(\d{4}-\d{2}-\d{2})(?: (\d{2}:\d{2}))? (.+?)(?:\.md)?$/.exec(f.name); return m && { id: f.id, date: m[1], time: m[2] || '', text: m[3] }; };
const byTime = (a, b) => a.time.localeCompare(b.time) || a.text.localeCompare(b.text);
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

function renderCal() {
  const y = view.getFullYear(), m = view.getMonth();
  $('#month').textContent = `${y}년 ${m + 1}월`;
  const g = $('#grid'); g.replaceChildren();
  DOW.forEach((d, i) => g.append(el('div', { class: 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') }, d)));
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = ymd(new Date());
  const cells = Math.ceil((first + days) / 7) * 7;
  for (let i = 0; i < cells; i++) {
    const n = i - first + 1;
    if (n < 1 || n > days) { g.append(el('div', { class: 'day blank' })); continue; }
    const date = `${y}-${pad(m + 1)}-${pad(n)}`, wd = i % 7;
    const evs = events.filter(e => e.date === date).sort(byTime);
    const b = el('button', { class: 'day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (date === today ? ' today' : ''), 'aria-pressed': String(date === sel), 'aria-label': `${m + 1}월 ${n}일, 일정 ${evs.length}개` },
      el('span', { class: 'num' }, String(n)));
    evs.slice(0, 3).forEach(e => b.append(el('span', { class: 'chip' }, (e.time ? e.time + ' ' : '') + e.text)));
    if (evs.length > 3) b.append(el('span', { class: 'more' }, `+${evs.length - 3}`));
    if (evs.length) { const d = el('span', { class: 'dots' }); evs.slice(0, 3).forEach(() => d.append(el('i'))); b.append(d); }
    b.onclick = () => { sel = date; renderCal(); };
    g.append(b);
  }
  const [sy, sm, sd] = sel.split('-').map(Number);
  $('#sel-title').textContent = `${sm}월 ${sd}일 (${DOW[new Date(sy, sm - 1, sd).getDay()]})`;
  const box = $('#sel-list'); box.replaceChildren();
  const evs = events.filter(e => e.date === sel).sort(byTime);
  if (!evs.length) box.append(el('div', { class: 'empty', style: 'padding:4px 0' }, calLoaded ? '이 날은 일정이 없어요. 아래에서 추가하세요.' : '일정을 불러오는 중…'));
  for (const e of evs) {
    const del = el('button', { class: 'btn danger' }, '삭제');
    del.onclick = () => armDelete(del, '삭제', () => deleteEvent(e));
    box.append(el('div', { class: 'ev' }, el('time', {}, e.time || '종일'), el('span', {}, e.text), del));
  }
}
async function loadCal() {
  events = (await list(`'${CAL}' in parents and trashed = false`)).map(parseEv).filter(Boolean);
  calLoaded = true; renderCal();
}
$('#add').addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = clean($('#ev-text').value).slice(0, 120), time = $('#ev-time').value;
  if (!text) return;
  status('일정 추가 중…');
  try {
    const f = await createFile(CAL, `${sel}${time ? ' ' + time : ''} ${text}.md`, text);
    events.push({ id: f.id, date: sel, time, text });
    $('#ev-text').value = ''; $('#ev-time').value = '';
    renderCal(); status('일정을 추가했어요.', 'ok');
  } catch (e) { fail(e); }
});
async function deleteEvent(e) {
  status('삭제 중…');
  try { await trash(e.id); events = events.filter(x => x.id !== e.id); renderCal(); status('드라이브 휴지통으로 옮겼어요.', 'ok'); }
  catch (err) { fail(err); }
}
$('#prev').onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); };
$('#next').onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); };
$('#today').onclick = () => { const t = new Date(); view.setFullYear(t.getFullYear(), t.getMonth(), 1); sel = ymd(t); renderCal(); };

/* ---------- tabs, sync, boot ---------- */
function showTab(name) {
  if (!token) return;
  const cal = name === 'calendar';
  $('#view-cal').hidden = !cal; $('#view-notes').hidden = cal;
  $('#tab-cal').setAttribute('aria-selected', String(cal)); $('#tab-notes').setAttribute('aria-selected', String(!cal));
}
$('#tab-notes').onclick = () => { location.hash = 'notes'; };
$('#tab-cal').onclick = () => { location.hash = 'calendar'; };
window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

let syncing = false;
async function syncAll() {
  if (!token || syncing) return;
  if (dirty()) await saveNote();
  syncing = true; $('#refresh').disabled = true; status('드라이브와 동기화하는 중…');
  try {
    if (!NOTES) { const root = await folder(ROOT_NAME); NOTES = await folder('노트', root); CAL = await folder('캘린더', root); }
    await loadNotes(); await loadCal();
    status(`동기화됨 ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`, 'ok');
  } catch (e) { fail(e); }
  syncing = false; $('#refresh').disabled = false;
}
$('#refresh').onclick = syncAll;
// pick up changes made on the other device when the app comes back to the front
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !dirty()) syncAll(); });

renderCal(); renderEditor();
token = loadToken();
if (token) { showApp(); syncAll(); } else needLogin();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
